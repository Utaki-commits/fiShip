<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:#F8F9FA;font-family:var(--font-sans)}
.lbl{font-size:14px;font-weight:700;color:#9CA3AF;letter-spacing:.06em;margin:0 4px 12px;text-transform:uppercase}

.bar{
  position:relative;
  background:
    radial-gradient(120% 200% at 88% 110%, rgba(63,160,217,.45) 0%, transparent 55%),
    radial-gradient(80% 120% at 12% -20%, rgba(212,172,13,.18) 0%, transparent 60%),
    linear-gradient(180deg, #1E5F8E 0%, #0F4570 55%, #04192B 100%);
  padding:18px 22px;
  display:flex;align-items:center;gap:18px;
  border-radius:16px;
  overflow:hidden;
  isolation:isolate;
  min-height:80px;
}
.bar::before{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(242,199,68,.55) 30%,rgba(242,199,68,.85) 50%,rgba(242,199,68,.55) 70%,transparent 100%);
  z-index:2;
}
.bar svg.waves{
  position:absolute;left:0;right:0;bottom:-2px;width:100%;height:44px;
  opacity:.55;z-index:1;pointer-events:none;
}

/* ---------- Logo: customer-supplied 遊漁船サンライズ mark ---------- */
.mark{
  position:relative;z-index:3;flex-shrink:0;
  width:56px;height:56px;
  display:block;object-fit:contain;
}

.t{flex:1;min-width:0;position:relative;z-index:3;
  display:flex;align-items:center;gap:14px}
.vessel{font-size:24px;font-weight:700;color:#fff;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.sep{color:rgba(255,255,255,.32);font-weight:300;font-size:28px;flex-shrink:0;line-height:1}
.capWrap{display:flex;flex-direction:column;line-height:1;min-width:0;flex-shrink:1;gap:5px}
.kicker{
  font-size:12px;font-weight:700;letter-spacing:.18em;
  color:rgba(242,199,68,.95);
  text-transform:uppercase;
}
.cap{font-size:20px;font-weight:600;color:rgba(255,255,255,.96);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}

.right{display:flex;align-items:center;gap:8px;flex-shrink:0;position:relative;z-index:3}

.pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 16px 10px 14px;
  background:rgba(212,172,13,.18);
  border:2px solid rgba(242,199,68,.55);
  border-radius:99px;
  font-size:16px;font-weight:700;color:#F2C744;
  min-height:44px;
}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#F2C744;
  box-shadow:0 0 0 4px rgba(242,199,68,.22)}

.btn{
  width:48px;height:48px;border-radius:12px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.22);
  color:rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;
}

/* === LOGO STUDY === */
.study{margin-top:32px;padding:28px;background:#0A2540;border-radius:16px;
  display:flex;gap:28px;align-items:center}
.study .desc{font-size:18px;color:rgba(255,255,255,.85);line-height:1.7;flex:1}
.study .desc b{color:#F2C744;font-weight:700}
</style></head><body>

<!-- customer-supplied brand mark -->

<div class="lbl">DASHBOARD · STICKY TOP BAR</div>
<div class="bar">
  <svg class="waves" viewBox="0 0 700 36" preserveAspectRatio="none">
    <path d="M0 22 Q 90 14, 180 22 T 360 22 T 540 22 T 720 22 V36 H0 Z" fill="rgba(63,160,217,.35)"/>
    <path d="M0 28 Q 90 22, 180 28 T 360 28 T 540 28 T 720 28 V36 H0 Z" fill="rgba(63,160,217,.55)"/>
  </svg>
  <img class="mark" src="../assets/brand-mark.png" alt="fiShip">
  <div class="t">
    <div class="vessel">海皇丸</div>
    <div class="sep">/</div>
    <div class="capWrap">
      <div class="kicker">船長</div>
      <div class="cap">山田 太郎</div>
    </div>
  </div>
  <div class="right">
    <span class="pill"><span class="dot"></span>承認待ち 3件</span>
    <button class="btn" aria-label="ログアウト">⎋</button>
  </div>
</div>

<div style="height:14px"></div>

<div class="lbl">VARIANT · NO PENDING</div>
<div class="bar">
  <svg class="waves" viewBox="0 0 700 36" preserveAspectRatio="none">
    <path d="M0 22 Q 90 14, 180 22 T 360 22 T 540 22 T 720 22 V36 H0 Z" fill="rgba(63,160,217,.35)"/>
    <path d="M0 28 Q 90 22, 180 28 T 360 28 T 540 28 T 720 28 V36 H0 Z" fill="rgba(63,160,217,.55)"/>
  </svg>
  <img class="mark" src="../assets/brand-mark.png" alt="fiShip">
  <div class="t">
    <div class="vessel">海皇丸</div>
    <div class="sep">/</div>
    <div class="capWrap">
      <div class="kicker">船長</div>
      <div class="cap">山田 太郎</div>
    </div>
  </div>
  <div class="right">
    <button class="btn" aria-label="ログアウト">⎋</button>
  </div>
</div>

<div class="study">
  <img src="../assets/brand-mark.png" alt="" style="width:120px;height:120px;display:block;flex-shrink:0">
  <div class="desc">
    <b>遊漁船サンライズマーク</b> — お客様支給の円形シール。<br>
    濃色サーフェス上で自然と<b>「白いセーフエリア」</b>として浮かび、家紋的な存在感を持つ。
  </div>
</div>

</body></html>
