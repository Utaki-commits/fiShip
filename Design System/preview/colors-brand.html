<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans)}
.row{display:flex;gap:14px}
.s{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:96px;border-radius:12px;position:relative;overflow:hidden}
.chip.ocean{background:linear-gradient(180deg,#2A78B0 0%,#1E5F8E 60%,#164B73 100%)}
.lbl{display:flex;flex-direction:column;gap:2px}
.name{font-size:13px;font-weight:700;color:#111827}
.hex{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#6B7280}
.use{font-size:11px;color:#9CA3AF}
</style></head><body>
<div class="row">
  <div class="s"><div class="chip ocean"></div>
    <div class="lbl"><div class="name">Ocean</div><div class="hex">#1E5F8E</div><div class="use">primary · clear-water mid-day</div></div></div>
  <div class="s"><div class="chip" style="background:#3FA0D9"></div>
    <div class="lbl"><div class="name">Ocean light</div><div class="hex">#3FA0D9</div><div class="use">selected border, Sat</div></div></div>
  <div class="s"><div class="chip" style="background:#E8F4FD;border:1px solid #E5E7EB"></div>
    <div class="lbl"><div class="name">Ocean pale</div><div class="hex">#E8F4FD</div><div class="use">selected fill, day cell</div></div></div>
  <div class="s"><div class="chip" style="background:#D4AC0D"></div>
    <div class="lbl"><div class="name">Gold</div><div class="hex">#D4AC0D</div><div class="use">brand mark, today, accent</div></div></div>
</div>
</body></html>
