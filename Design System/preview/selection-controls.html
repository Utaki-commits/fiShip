<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=720">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:32px;background:#fff;font-family:'Noto Sans JP',sans-serif}
.lbl{font-size:14px;font-weight:700;color:#9CA3AF;margin:0 0 12px;letter-spacing:.06em;text-transform:uppercase}
.q{font-size:20px;font-weight:600;color:#111827;margin-bottom:14px}
.row{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap}
.opt{flex:1;min-width:120px;padding:22px 8px;text-align:center;border-radius:14px;font-weight:700;font-size:22px;cursor:pointer;transition:transform .08s, background .12s, border-color .12s;min-height:80px;display:flex;align-items:center;justify-content:center}
.opt.off{background:#fff;border:2px solid #E5E7EB;color:#374151}
.opt.off:hover{background:#F8F9FA;border-color:#9CA3AF}
.opt.on{background:#E8F4FD;border:3px solid #1E5F8E;color:#0A3D62;padding:21px 7px}

.tog{display:flex;align-items:center;justify-content:space-between;padding:22px;border-radius:14px;margin-bottom:14px;gap:18px}
.tog.on{background:#FBF3D4;border:2px solid #D4AC0D}
.tog.off{background:#fff;border:2px solid #E5E7EB}
.tlabel{font-size:20px;font-weight:700;color:#111827;line-height:1.3}
.tsub{font-size:16px;color:#6B7280;margin-top:6px;line-height:1.5}
.sw{width:72px;height:40px;border-radius:20px;position:relative;flex-shrink:0;cursor:pointer;transition:background .15s}
.sw.on{background:#D4AC0D}
.sw.off{background:#D1D5DB}
.knob{position:absolute;top:4px;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:left .18s}
.sw.on .knob{left:36px}
.sw.off .knob{left:4px}
</style></head><body>

<div class="lbl">SINGLE-SELECT</div>
<div class="q">船の最大乗船人数</div>
<div class="row">
  <div class="opt off">4名</div>
  <div class="opt on">6名</div>
  <div class="opt off">8名</div>
  <div class="opt off">10名</div>
</div>

<div class="lbl">TOGGLE</div>
<div class="tog on">
  <div><div class="tlabel">貸切（チャーター）も受け付ける</div><div class="tsub">グループで船を借り切る予約です</div></div>
  <div class="sw on"><div class="knob"></div></div>
</div>
<div class="tog off">
  <div><div class="tlabel">釣り初心者も受け付ける</div><div class="tsub">「初心者歓迎」と案内に表示されます</div></div>
  <div class="sw off"><div class="knob"></div></div>
</div>
</body></html>
