<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans)}
.row{display:flex;gap:16px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;align-items:center;gap:6px}
.b{width:64px;height:64px;background:#E8F4FD;border:2px solid #2E86C1}
.v{font-size:11px;font-weight:700;color:#111827}
.k{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#9CA3AF}
</style></head><body>
<div class="row">
  <div class="s"><div class="b" style="border-radius:6px"></div><div class="v">6 · sm</div><div class="k">chips, logout</div></div>
  <div class="s"><div class="b" style="border-radius:8px"></div><div class="v">8 · md</div><div class="k">cell, error pill</div></div>
  <div class="s"><div class="b" style="border-radius:10px"></div><div class="v">10 · lg</div><div class="k">inputs, options</div></div>
  <div class="s"><div class="b" style="border-radius:12px"></div><div class="v">12 · xl</div><div class="k">primary buttons</div></div>
  <div class="s"><div class="b" style="border-radius:14px"></div><div class="v">14 · 2xl</div><div class="k">cards</div></div>
  <div class="s"><div class="b" style="border-radius:16px"></div><div class="v">16 · 3xl</div><div class="k">login card</div></div>
  <div class="s"><div class="b" style="border-radius:99px"></div><div class="v">99 · pill</div><div class="k">status, count</div></div>
</div>
</body></html>
