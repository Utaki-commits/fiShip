<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans)}
.row{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;align-items:center;gap:6px}
.b{background:#1E5F8E;border-radius:4px}
.k{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#9CA3AF}
.v{font-size:11px;font-weight:700;color:#111827}
</style></head><body>
<div class="row">
  <div class="s"><div class="b" style="width:2px;height:2px"></div><div class="v">2</div><div class="k">--space-1</div></div>
  <div class="s"><div class="b" style="width:4px;height:4px"></div><div class="v">4</div><div class="k">--space-2</div></div>
  <div class="s"><div class="b" style="width:6px;height:6px"></div><div class="v">6</div><div class="k">--space-3</div></div>
  <div class="s"><div class="b" style="width:8px;height:8px"></div><div class="v">8</div><div class="k">--space-4</div></div>
  <div class="s"><div class="b" style="width:10px;height:10px"></div><div class="v">10</div><div class="k">--space-5</div></div>
  <div class="s"><div class="b" style="width:12px;height:12px"></div><div class="v">12</div><div class="k">--space-6</div></div>
  <div class="s"><div class="b" style="width:14px;height:14px"></div><div class="v">14</div><div class="k">--space-7</div></div>
  <div class="s"><div class="b" style="width:16px;height:16px"></div><div class="v">16</div><div class="k">--space-8</div></div>
  <div class="s"><div class="b" style="width:20px;height:20px"></div><div class="v">20</div><div class="k">--space-10</div></div>
  <div class="s"><div class="b" style="width:24px;height:24px"></div><div class="v">24</div><div class="k">--space-12</div></div>
  <div class="s"><div class="b" style="width:32px;height:32px"></div><div class="v">32</div><div class="k">--space-16</div></div>
</div>
</body></html>
