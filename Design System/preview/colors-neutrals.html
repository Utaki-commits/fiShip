<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans)}
.row{display:flex;gap:10px}
.s{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:88px;border-radius:12px;border:1px solid #E5E7EB}
.lbl{display:flex;flex-direction:column;gap:2px}
.name{font-size:12px;font-weight:700;color:#111827}
.hex{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#6B7280}
</style></head><body>
<div class="row">
  <div class="s"><div class="chip" style="background:#F8F9FA"></div>
    <div class="lbl"><div class="name">bg</div><div class="hex">#F8F9FA</div></div></div>
  <div class="s"><div class="chip" style="background:#FFFFFF"></div>
    <div class="lbl"><div class="name">surface</div><div class="hex">#FFFFFF</div></div></div>
  <div class="s"><div class="chip" style="background:#E5E7EB"></div>
    <div class="lbl"><div class="name">border</div><div class="hex">#E5E7EB</div></div></div>
  <div class="s"><div class="chip" style="background:#9CA3AF"></div>
    <div class="lbl"><div class="name">fg-3</div><div class="hex">#9CA3AF</div></div></div>
  <div class="s"><div class="chip" style="background:#6B7280"></div>
    <div class="lbl"><div class="name">fg-2</div><div class="hex">#6B7280</div></div></div>
  <div class="s"><div class="chip" style="background:#111827"></div>
    <div class="lbl"><div class="name">fg-1</div><div class="hex">#111827</div></div></div>
</div>
</body></html>
