name: Auditor

on:
  workflow_run:
    workflows: ["CI"]   # ← 既存CIのworkflow名
    types:
      - completed

jobs:
  audit:
    # CIが成功した場合のみ実行
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PR番号を取得
        id: pr_info
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`
            })
            if (runs.data.length === 0) {
              core.setOutput('pr_number', '')
              core.setOutput('pr_title', '')
              return
            }
            const pr = runs.data[0]
            core.setOutput('pr_number', pr.number.toString())
            core.setOutput('pr_title', pr.title)

      - name: PRが存在しない場合はスキップ
        if: steps.pr_info.outputs.pr_number == ''
        run: echo "対象PRなし。スキップします。" && exit 0

      - name: diffを取得
        id: diff
        run: |
          git fetch origin main
          DIFF=$(git diff origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' | head -c 15000)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Auditor実行
        id: auditor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_DIFF: ${{ steps.diff.outputs.diff }}
          PR_NUMBER: ${{ steps.pr_info.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr_info.outputs.pr_title }}
        run: node .github/scripts/run-auditor.js

      - name: PRコメントを投稿
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `${{ steps.auditor.outputs.pr_comment }}`
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr_info.outputs.pr_number }},
              body: comment
            })

      - name: Red判定時にラベルを付与
        if: steps.auditor.outputs.overall_verdict == 'red'
        uses: actions/github-script@v7
        with:
          script: |
            // ラベルがなければ作成
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'auditor:red',
                color: 'B91C1C',
                description: 'Auditor Red判定 — 修正必須'
              })
            } catch {}
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr_info.outputs.pr_number }},
              labels: ['auditor:red']
            })

      - name: レポートをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ai-reports/
          git diff --cached --quiet || git commit -m "report: Auditor結果を保存 PR#${{ steps.pr_info.outputs.pr_number }}"
          git push origin HEAD:${{ github.event.workflow_run.head_branch }}
