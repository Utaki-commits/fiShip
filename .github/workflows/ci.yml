name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run npm test if present
        shell: bash
        run: |
          if npm run | grep -qE '^  test$'; then
            npm test
          else
            echo "No npm test script found. Skipping."
          fi
