name: Captain UI Review

on:
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: UIレビュー実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node -e "
          const fs = require('fs')
          const path = require('path')

          const files = ['dashboard','bookings','bins','blocked-dates','vessel','account','customers','logs','extract']

          async function reviewAll() {
            const results = []
            for (const name of files) {
              const imgPath = path.join('docs/ai-reports/screenshots/captain', name + '.png')
              if (!fs.existsSync(imgPath)) { results.push({ name, review: 'ファイルなし' }); continue }
              const img = fs.readFileSync(imgPath).toString('base64')
              const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-api-key': process.env.ANTHROPIC_API_KEY,
                  'anthropic-version': '2023-06-01'
                },
                body: JSON.stringify({
                  model: 'claude-sonnet-4-20250514',
                  max_tokens: 800,
                  messages: [{
                    role: 'user',
                    content: [
                      { type: 'image', source: { type: 'base64', media_type: 'image/png', data: img }},
                      { type: 'text', text: 'この船長向け業務管理UIの問題点を以下の観点で箇条書き（最大5点）してください。\n・カラーの一貫性\n・文字サイズ\n・タップ領域\n・情報の優先順位\n・CAPTAIN_UX_DNA違反（海上での使いやすさ）\n問題がない場合は「問題なし」と記載。' }
                    ]
                  }]
                })
              })
              const data = await res.json()
              results.push({ name, review: data.content[0].text })
              console.log('完了:', name)
            }
            const report = results.map(r => '## ' + r.name + '\n\n' + r.review).join('\n\n---\n\n')
            fs.writeFileSync('docs/ai-reports/captain-ui-review.md', report)
          }

          reviewAll().catch(e => { console.error(e); process.exit(1) })
          "

      - name: レポートをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ai-reports/captain-ui-review.md
          git diff --cached --quiet || git commit -m "report: 船長UI自動レビュー結果"
          git push origin main
